[project]
name = "valutatrade_hub"
version = "0.1.0"
description = "ValutaTrade Hub - trading platform"
authors = [
    {name = "arthuras", email = "arthuras.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "valutatrade_hub"
version = "0.1.0"
description = "ValutaTrade Hub - trading platform"
authors = ["arthuras <arthuras.work@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10"
requests = "^2.32.5"

[tool.poetry.scripts]
project = "main:main"

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []