[project]
name = "finalproject-sugonyaev-m25-555"
version = "0.1.0"
description = "ValutaTrade Hub - trading platform"
authors = [
    {name = "arthuras", email = "arthuras.work@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [

]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "finalproject-sugonyaev-m25-555"
version = "0.1.0"
description = "ValutaTrade Hub - trading platform"
authors = ["arthuras <arthuras.work@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10"

[tool.poetry.scripts]
project = "main:main"  

[[tool.poetry.packages]]
include = "valutatrade_hub"
from = "."

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.poetry.group.dev.dependencies]
ruff = "^0.1.0"